# Dual-port nginx proxy for LibreChat
# Port 443  -> public  (registration disabled)
# Port 9443 -> admin   (registration enabled)
#
# Prerequisites:
#   1. Place your SSL cert and key at:
#        ./nginx/ssl/nginx.crt
#        ./nginx/ssl/nginx.key
#   2. Set ALLOW_REGISTRATION=true in .env
#   3. Run: docker compose up -d

services:
  # Remove direct port exposure from the api service so all traffic
  # flows through nginx. The api remains reachable internally on port 3080.
  api:
    ports: !override []

  nginx:
    container_name: LibreChat-nginx
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
